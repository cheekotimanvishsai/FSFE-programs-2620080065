<html><head>
    <title>Flexbox Example</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content:center;
            align-items:center;
            background-color: lightgray;
            padding: 20px;
        }
        .card{
            width: 100px;
            padding: 20px;
            background-color:lightblue;
            border: 2px solid blue;
            text-align: center;
        }
        </style></head><body>
            <h1> ABC collage</h1>
            <div class="container">
                <div class="card"></div>
                <h2>cse</h2>
                <p>computer science and engineering</p>
            </div>
             <div class="ece">Card 1</div>
                <h2>ece</h2>
                <p>electrical engineering</p>
            </div>
        </body>
        }
        @media(max-width:980px){
            .box{
                width: 100%;
                background-color: lightgreen;
                
            }
        }
    </style>
</head>

</html>
